<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый год 2027 — города России</title>
<style>
:root{
  --bg1:#020b1d;
  --bg2:#0d2348;
  --bg3:#173e6d;
  --ice:#bfe9ff;
  --ice-2:#8fd3ff;
  --white:#f5fbff;
  --glow: rgba(143,211,255,.7);
  --text-shadow: 0 0 18px rgba(143,211,255,.9), 0 0 42px rgba(95,170,255,.6), 0 0 90px rgba(95,170,255,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#020a1c;color:var(--white);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
body{overflow:hidden}
#stage{
  position:relative;width:100vw;height:100dvh;min-height:420px;overflow:hidden;
  background:radial-gradient(circle at 50% 22%, rgba(28,61,123,.9), rgba(3,12,28,1) 44%, rgba(1,7,20,1) 100%);
}
#photo{
  position:absolute;inset:0;background-size:cover;background-position:center;opacity:.52;filter:saturate(1.08) brightness(.78);
  transform:scale(1.05);
  background-image:linear-gradient(135deg,#0b2a5b,#04122e);
}
#shade{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg, rgba(1,8,24,.62), rgba(2,10,28,.28), rgba(1,8,24,.62)),
    linear-gradient(0deg, rgba(2,8,22,.2), rgba(2,8,22,.18));
}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
main{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(18px,4vw,64px);
}
h1{
  font-size:clamp(22px,3.3vw,58px);
  letter-spacing:.18em;
  font-weight:300;
  color:var(--ice);
  text-shadow: var(--text-shadow);
  margin-bottom:clamp(18px,3vh,34px);
}
.timer{
  display:flex;justify-content:center;gap:clamp(10px,2.8vw,44px);
  width:100%;margin-bottom:clamp(18px,3vh,36px);flex-wrap:nowrap;
}
.unit{
  display:flex;flex-direction:column;align-items:center;
  min-width:0;flex:1 1 0;
}
.unit b{
  display:block;
  font-size:clamp(42px,11vw,210px);
  line-height:1;
  font-weight:200;
  font-variant-numeric:tabular-nums;
  color:var(--white);
  text-shadow: 0 0 12px rgba(255,255,255,.8), 0 0 24px rgba(143,211,255,.9), 0 0 42px rgba(95,170,255,.9), 0 0 80px rgba(95,170,255,.7);
}
.unit span{
  font-size:clamp(10px,1.7vw,26px);
  letter-spacing:.08em;
  color:var(--ice);
  margin-top:8px;
  text-transform:lowercase;
}
.lead{
  font-size:clamp(15px,2.2vw,36px);
  color:var(--ice);
  font-weight:300;
}
#city{
  font-size:clamp(30px,6vw,110px);
  font-weight:600;
  line-height:1.12;
  margin:12px 0 10px;
  text-shadow: 0 0 26px rgba(143,211,255,.7), 0 0 62px rgba(95,170,255,.5);
  max-width:100%;
  overflow-wrap:anywhere;
}
.sub{
  font-size:clamp(12px,1.7vw,26px);
  color:#d8eeff;
  font-weight:300;
  max-width:1500px;line-height:1.35;margin-top:4px;
  text-shadow: 0 0 12px rgba(143,211,255,.2);
}
#foot{
  position:absolute;left:12px;right:12px;bottom:clamp(12px,3vh,34px);
  text-align:center;font-size:clamp(11px,1.3vw,20px);color:#8fb6dd;
  text-shadow:0 0 14px rgba(143,211,255,.15);
}
@media(max-width:520px){
  .timer{gap:7px}
  .unit b{font-size:clamp(34px,10vw,80px)}
  .unit span{font-size:10px;letter-spacing:.05em}
  h1{letter-spacing:.1em}
  #city{font-size:clamp(26px,8vw,52px)}
}
</style>
</head>
<body>
<div id="stage">
  <div id="photo"></div>
  <div id="shade"></div>
  <canvas id="snow"></canvas>

  <main>
    <h1>НОВЫЙ ГОД 2027</h1>
    <div class="timer">
      <div class="unit"><b id="d">00</b><span>дней</span></div>
      <div class="unit"><b id="h">00</b><span>часов</span></div>
      <div class="unit"><b id="m">00</b><span>минут</span></div>
      <div class="unit"><b id="s">00</b><span>секунд</span></div>
    </div>
    <p class="lead">Сейчас отсчёт для города</p>
    <div id="city">Петропавловск-Камчатский</div>
    <p id="more" class="sub"></p>
    <p id="local" class="sub"></p>
  </main>

  <div id="foot">Автоматическая смена города каждые 30 секунд · Россия встречает 2027 год</div>
</div>

<script>
'use strict';

const ZONES = [
  {tz:'Asia/Kamchatka',cities:['Петропавловск-Камчатский','Елизово','Вилючинск']},
  {tz:'Asia/Anadyr',cities:['Анадырь','Певек','Билибино']},
  {tz:'Asia/Magadan',cities:['Магадан','Сусуман']},
  {tz:'Asia/Sakhalin',cities:['Южно-Сахалинск','Корсаков','Холмск','Оха']},
  {tz:'Asia/Srednekolymsk',cities:['Среднеколымск','Черский']},
  {tz:'Asia/Vladivostok',cities:['Владивосток','Хабаровск','Уссурийск','Находка','Артём','Комсомольск-на-Амуре','Биробиджан','Арсеньев','Большой Камень','Спасск-Дальний']},
  {tz:'Asia/Ust-Nera',cities:['Верхоянск','Усть-Нера']},
  {tz:'Asia/Yakutsk',cities:['Якутск','Благовещенск','Нерюнгри','Мирный','Ленск','Алдан','Удачный','Свободный','Тында']},
  {tz:'Asia/Chita',cities:['Чита','Краснокаменск']},
  {tz:'Asia/Irkutsk',cities:['Иркутск','Улан-Удэ','Ангарск','Братск','Усть-Илимск','Северобайкальск','Шелехов']},
  {tz:'Asia/Krasnoyarsk',cities:['Красноярск','Норильск','Абакан','Ачинск','Канск','Минусинск','Дудинка','Лесосибирск','Железногорск','Кызыл']},
  {tz:'Asia/Novosibirsk',cities:['Новосибирск','Бердск']},
  {tz:'Asia/Novokuznetsk',cities:['Кемерово','Новокузнецк','Прокопьевск']},
  {tz:'Asia/Barnaul',cities:['Барнаул','Бийск','Горно-Алтайск','Рубцовск']},
  {tz:'Asia/Tomsk',cities:['Томск','Северск']},
  {tz:'Asia/Omsk',cities:['Омск']},
  {tz:'Asia/Yekaterinburg',cities:['Екатеринбург','Челябинск','Уфа','Пермь','Тюмень','Оренбург','Курган','Магнитогорск','Нижний Тагил','Первоуральск','Каменск-Уральский','Златоуст','Миасс','Стерлитамак','Нефтекамск','Березники','Сургут','Нижневартовск','Нефтеюганск','Ханты-Мансийск','Ноябрьск','Новый Уренгой','Салехард']},
  {tz:'Europe/Samara',cities:['Самара','Тольятти','Ижевск','Сызрань','Новокуйбышевск','Глазов']},
  {tz:'Europe/Saratov',cities:['Саратов','Энгельс','Балаково']},
  {tz:'Europe/Ulyanovsk',cities:['Ульяновск','Димитровград']},
  {tz:'Europe/Astrakhan',cities:['Астрахань']},
  {tz:'Europe/Moscow',cities:['Москва','Санкт-Петербург','Нижний Новгород','Казань','Ростов-на-Дону','Краснодар','Сочи','Новороссийск','Воронеж','Ярославль','Владимир','Кострома','Иваново','Рязань','Тула','Калуга','Смоленск','Брянск','Орёл','Курск','Белгород','Липецк','Тамбов','Тверь','Великий Новгород','Псков','Вологда','Череповец','Архангельск','Мурманск','Петрозаводск','Сыктывкар','Нарьян-Мар','Пенза','Саранск','Чебоксары','Йошкар-Ола','Нижнекамск','Набережные Челны','Ставрополь','Пятигорск','Махачкала','Грозный','Владикавказ','Нальчик','Черкесск','Элиста','Майкоп']},
  {tz:'Europe/Volgograd',cities:['Волгоград','Волжский']},
  {tz:'Europe/Kirov',cities:['Киров']},
  {tz:'Europe/Kaliningrad',cities:['Калининград','Советск','Черняховск','Балтийск']}
];

const YEAR = 2027;
const ROTATE_MS = 30000;
const cities = [];

for (const z of ZONES) {
  for (const name of z.cities) cities.push({ name, tz: z.tz });
}

const fmtCache = new Map();

function formatter(tz) {
  if (!fmtCache.has(tz)) {
    fmtCache.set(tz, new Intl.DateTimeFormat('en-GB', {
      timeZone: tz,
      hourCycle: 'h23',
      year: 'numeric',
      month: 'numeric',
      day: 'numeric',
      hour: 'numeric',
      minute: 'numeric',
      second: 'numeric'
    }));
  }
  return fmtCache.get(tz);
}

function offsetAt(tz, ms) {
  const p = {};
  for (const x of formatter(tz).formatToParts(new Date(ms))) {
    if (x.type !== 'literal') p[x.type] = +x.value;
  }
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(ms / 1000) * 1000;
}

function newYear(tz) {
  const guess = Date.UTC(YEAR, 0, 1);
  let t = guess - offsetAt(tz, guess);
  t = guess - offsetAt(tz, t);
  return t;
}

function clock(tz, ms) {
  return new Intl.DateTimeFormat('ru-RU', {
    timeZone: tz,
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hourCycle: 'h23'
  }).format(new Date(ms));
}

function utc(tz, ms) {
  const h = offsetAt(tz, ms) / 3600000;
  return 'UTC' + (h >= 0 ? '+' : '−') + Math.abs(h);
}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

let current = -1;

const winterPhotos = [
  'https://images.unsplash.com/photo-1513326738677-b949b9c9e4f8?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1512389142860-9c449e58a543?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1455156218388-5e61b526818b?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1486911278844-a81c5267e227?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1519721117670-49e5f39f147b?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=85'
];

const photoForCity = {
  'Москва': 0,
  'Санкт-Петербург': 1,
  'Казань': 2,
  'Сочи': 3,
  'Владивосток': 4,
  'Новосибирск': 5,
  'Екатеринбург': 6,
  'Иркутск': 7,
  'Калининград': 8,
  'Петропавловск-Камчатский': 9
};

function changePhoto(city, index) {
  const photoIndex = photoForCity[city] ?? (index % winterPhotos.length);
  const el = $('photo');
  el.style.opacity = '0.12';

  const img = new Image();
  img.onload = () => {
    el.style.backgroundImage = `url("${winterPhotos[photoIndex]}")`;
    requestAnimationFrame(() => el.style.opacity = '.62');
  };
  img.onerror = () => {
    el.style.backgroundImage = 'linear-gradient(135deg,#0b2a5b,#04122e)';
    el.style.opacity = '.62';
  };
  img.src = winterPhotos[photoIndex];
}

function tick() {
  const now = Date.now();
  const index = Math.floor(now / ROTATE_MS) % cities.length;
  const c = cities[index];
  const target = newYear(c.tz);
  const left = Math.max(0, Math.ceil((target - now) / 1000));

  $('d').textContent = pad(Math.floor(left / 86400));
  $('h').textContent = pad(Math.floor(left / 3600) % 24);
  $('m').textContent = pad(Math.floor(left / 60) % 60);
  $('s').textContent = pad(left % 60);

  if (index !== current) {
    current = index;
    $('city').textContent = c.name;
    $('more').textContent = 'Город ' + (index + 1) + ' из ' + cities.length + ' · следующий город через 30 секунд';
    changePhoto(c.name, index);
  }

  $('local').textContent = 'Местное время: ' + clock(c.tz, now) + ' (' + utc(c.tz, now) + ')';
}

tick();
setInterval(tick, 250);

const canvas = $('snow');
const ctx = canvas.getContext('2d');
let flakes = [];

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  flakes = Array.from({ length: Math.max(35, Math.round(canvas.clientWidth / 15)) }, () => ({
    x: Math.random() * canvas.clientWidth,
    y: Math.random() * canvas.clientHeight,
    r: 1 + Math.random() * 2.5,
    v: 20 + Math.random() * 45,
    p: Math.random() * 6
  }));
}

function snow() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.72)';

  for (const f of flakes) {
    f.y += f.v / 30;
    f.p += 0.02;
    if (f.y > h + 5) {
      f.y = -5;
      f.x = Math.random() * w;
    }
    ctx.beginPath();
    ctx.arc(f.x + Math.sin(f.p) * 8, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(snow);
}

addEventListener('resize', resize);
resize();
requestAnimationFrame(snow);
</script>
</body>
</html>
