<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый год 2027 — города России</title>
<style>
:root{
  --bg1:#020b1d;
  --bg2:#0d2348;
  --bg3:#173e6d;
  --ice:#bfe9ff;
  --ice-2:#8fd3ff;
  --white:#f5fbff;
  --glow: rgba(143,211,255,.7);
  --text-shadow: 0 0 18px rgba(143,211,255,.9), 0 0 42px rgba(95,170,255,.6), 0 0 90px rgba(95,170,255,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#020a1c;color:var(--white);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
body{overflow:hidden}
#stage{
  position:relative;width:100vw;height:100dvh;min-height:420px;overflow:hidden;
  background:radial-gradient(circle at 50% 22%, rgba(28,61,123,.9), rgba(3,12,28,1) 44%, rgba(1,7,20,1) 100%);
}
#photo{
  position:absolute;inset:0;background-size:cover;background-position:center;opacity:.52;filter:saturate(1.08) brightness(.78);
  transform:scale(1.05);
  background-image:linear-gradient(135deg,#0b2a5b,#04122e);
}
#shade{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg, rgba(1,8,24,.62), rgba(2,10,28,.28), rgba(1,8,24,.62)),
    linear-gradient(0deg, rgba(2,8,22,.2), rgba(2,8,22,.18));
}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
main{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(18px,4vw,64px);
}
h1{
  font-size:clamp(22px,3.3vw,58px);
  letter-spacing:.18em;
  font-weight:300;
  color:var(--ice);
  text-shadow: var(--text-shadow);
  margin-bottom:clamp(18px,3vh,34px);
}
.timer{
  display:flex;justify-content:center;gap:clamp(10px,2.8vw,44px);
  width:100%;margin-bottom:clamp(18px,3vh,36px);flex-wrap:nowrap;
}
.unit{
  display:flex;flex-direction:column;align-items:center;
  min-width:0;flex:1 1 0;
}
.unit b{
  display:block;
  font-size:clamp(42px,11vw,210px);
  line-height:1;
  font-weight:200;
  font-variant-numeric:tabular-nums;
  color:var(--white);
  text-shadow: 0 0 12px rgba(255,255,255,.8), 0 0 24px rgba(143,211,255,.9), 0 0 42px rgba(95,170,255,.9), 0 0 80px rgba(95,170,255,.7);
}
.unit span{
  font-size:clamp(10px,1.7vw,26px);
  letter-spacing:.08em;
  color:var(--ice);
  margin-top:8px;
  text-transform:lowercase;
}
.lead{
  font-size:clamp(15px,2.2vw,36px);
  color:var(--ice);
  font-weight:300;
}
#city{
  font-size:clamp(30px,6vw,110px);
  font-weight:600;
  line-height:1.12;
  margin:12px 0 10px;
  text-shadow: 0 0 26px rgba(143,211,255,.7), 0 0 62px rgba(95,170,255,.5);
  max-width:100%;
  overflow-wrap:anywhere;
}
.sub{
  font-size:clamp(12px,1.7vw,26px);
  color:#d8eeff;
  font-weight:300;
  max-width:1500px;line-height:1.35;margin-top:4px;
  text-shadow: 0 0 12px rgba(143,211,255,.2);
}
#foot{
  position:absolute;left:12px;right:12px;bottom:clamp(12px,3vh,34px);
  text-align:center;font-size:clamp(11px,1.3vw,20px);color:#8fb6dd;
  text-shadow:0 0 14px rgba(143,211,255,.15);
}
@media(max-width:520px){
  .timer{gap:7px}
  .unit b{font-size:clamp(34px,10vw,80px)}
  .unit span{font-size:10px;letter-spacing:.05em}
  h1{letter-spacing:.1em}
  #city{font-size:clamp(26px,8vw,52px)}
}
</style>
</head>
<body>
<div id="stage">
  <div id="photo"></div>
  <div id="shade"></div>
  <canvas id="snow"></canvas>

  <main>
    <h1>НОВЫЙ ГОД 2027</h1>
    <div class="timer">
      <div class="unit"><b id="d">00</b><span>дней</span></div>
      <div class="unit"><b id="h">00</b><span>часов</span></div>
      <div class="unit"><b id="m">00</b><span>минут</span></div>
      <div class="unit"><b id="s">00</b><span>секунд</span></div>
    </div>
    <p class="lead">Сейчас отсчёт для города</p>
    <div id="city">Петропавловск-Камчатский</div>
    <p id="more" class="sub"></p>
    <p id="local" class="sub"></p>
  </main>

  <div id="foot">Автоматическая смена города каждые 30 секунд · Россия встречает 2027 год</div>
</div>

<style>
  #nyMusicBtn{
    position:fixed;left:10px;bottom:10px;padding:8px 12px;font-size:14px;font-weight:600;color:#fff;background:#c0152f;border:1px solid #fff;border-radius:8px;cursor:pointer;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;z-index:2147483647
  }
  #nyMusicBtn[aria-pressed="true"]{background:#0aa04a}
</style>
<button id="nyMusicBtn" type="button" aria-pressed="false">🎄 Включить музыку</button>

  const btn = document.getElementById('nyMusicBtn');
  let audio = null;
  let isPlaying = false;

  var TRACK_DATA = [
    "SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//twAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAywAA+KXgADBggLDRASFRgaHR8iJCcpLC4xMzY4Oz1AQkVHSkxPUlRYWl1fYmRnaWxvcXR2eXt+gIO5m1Oq3wAaqQ0Yx7lWsKoiP7nbD5s0hbaNr0n1cE7lL5d7ufw8ID34y+1fqU8N+CZV2lZ7d1uUBDL7EiSxoQm6k+0X9fKMpSe2aH/0dQ1LZpB9A+9kP6rQ3sI8XxzjD2t+YIh3u3z7AkQi2UvZcOe1W88QfI6YQ1G6B4z52/5cW5d1S4zPiGq9K8bZxzO5wh4RifS5X/j4B2nPygR9wYMl0sv8glaD3A8mghNniPH+NQvX1M2nA0bArJr9ttS9XH9DkFj8XK9tWJkJ6mA4S0p2P3DB3/x2n7b8+K2s0Z/6zW4EqH6N7luh4cWvx4aZdMca6vW3obX1K0w0GVj0JwzvcN0oV+Jxe/ae8zCg5PJQAhM0Xg1W6G0TWq2A+AtA7m0w7eL8vKAFczcD1VdL7CH6WGO0c3I+qX2OP3zP2d1C7nRE9/C1u0PQZ3Q2n6bRrKG1l0K9mPVg6hClOa7D0HnD6wRz66LvY0L9giQhFvWE3kW8QW5f4vA4rK8eXnNA0N790+L8g+Tj/42LJ1g4T0w8dE8oVw4Oz5g0V80yH9I/LhZ6yJdN6d5Oh2UAZxgkXvA0Lh2N+3cWZ+Q==",
    "SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//twAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAywAA+KXgADBggLDRASFRgaHR8iJCcpLC4xMzY4Oz1AQkVHSkxPUlRYWl1fYmRnaWxvcXR2eXt+gIOiX8m5w2S4mZs8Ck9lVv0bZ9Q0S5otnS2KqoPZa0E0h1+dYoJqHTBkOkBtmY/0K1nK6V9pUX4tJ8x1D7EhP9UDWtCk3M7sYVT9Fv/1NsH6k+i4rJTkhdA1F0uZ8Oa7Xt5fQaJr+W3d49hUI8xUQ5N2hqqR6gD7a9j0Ok1o2m4z95pFjR2a7Y1V4f5PXc/3E9HQLmWfU8wJub3JxVXh3qt5Ke52W6pmMpL1JQ/4K6BBK7mJ7F4yxPzqWXm4/9JvYjwfOAk4gktoQHcZy1w7Gq+vL7ciuo0x4wiqWQF8rD1xqj0w7P4ZCk8WJvX0PWp0iYk+1xqoT0d8nU8zGw6DF6yO+rKgQ2U/wbGxqBUXLQ==",

  ];

  function decodeTrackData(str) {
    try {
      return atob(str);
    } catch (e) {
      console.error('Ошибка декодирования base64:', e);
      return null;
    }
  }

  function buildAudio() {
    if (audio) return audio;
    const source = TRACK_DATA && TRACK_DATA[0];
    if (!source) return null;
    const binary = decodeTrackData(source);
    if (!binary) return null;
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'audio/mpeg' });
    audio = new Audio(URL.createObjectURL(blob));
    audio.loop = true;
    audio.volume = 0.65;
    return audio;
  }

  btn.addEventListener('click', async function () {
    try {
      if (!audio) {
        audio = buildAudio();
        if (!audio) {
          alert('Не удалось загрузить музыку. Проверьте TRACK_DATA.');
          return;
        }
      }

      if (!isPlaying) {
        await audio.play();
        isPlaying = true;
        btn.textContent = '🔊 Выключить музыку';
        btn.setAttribute('aria-pressed', 'true');
      } else {
        audio.pause();
        isPlaying = false;
        btn.textContent = '🎄 Включить музыку';
        btn.setAttribute('aria-pressed', 'false');
      }
    } catch (e) {
      console.error('Плеер не запустился:', e);
      alert('Нажмите кнопку ещё раз — браузер может блокировать звук до первого действия пользователя.');
    }
