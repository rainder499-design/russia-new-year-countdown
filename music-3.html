<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музыка</title>
<style>
  html,body{margin:0;height:100%;background:transparent}
  /* Видимая кнопка с высоким z-index — чтобы она точно была на виду */
  #nyMusicBtn{
    position:fixed;left:12px;bottom:12px;padding:8px 12px;font-size:14px;font-weight:600;color:#fff;background:#c0152f;border:1px solid #fff;border-radius:10px;cursor:pointer;font-family:system-ui,Segoe UI,Arial,sans-serif;z-index:2147483647;box-shadow:0 6px 18px rgba(0,0,0,.35)
  }
  #nyMusicBtn[aria-pressed="true"]{background:#0aa04a}
  /* Не ломаем видимость на мобильных */
  @media(max-width:520px){#nyMusicBtn{left:8px;bottom:8px;padding:7px 10px;font-size:13px}}
</style>
</head>
<body>
<button id="nyMusicBtn" type="button" aria-pressed="false">🎄 Включить музыку</button>

<script>
/*
  Простой, надёжный воспроизводитель музыки без внешних файлов.
  - Кнопка всегда видна (фиксированная, высокий z-index).
  - Звук генерируется через Web Audio API (осцилляторы) — не нужен mp3/base64 и не нужно менять другие файлы.
  - Аудио-контекст создаётся только при клике (чтобы обойти ограничения браузеров на autoplay).
  - Кнопка переключает воспроизведение/пауза и обновляет aria-pressed.
*/
(function(){
  const btn = document.getElementById('nyMusicBtn');
  let ctx = null;
  let masterGain = null;
  let running = false;
  let loopTimer = null;
  let scheduledOsc = [];

  // Набор нот в частотах (A4 = 440Hz). Простая новогодняя тема в лупе.
  const NOTES = [
    659.25, 659.25, 698.46, 659.25, 783.99, // E5 E5 F#5 E5 G5
    659.25, 659.25, 698.46, 659.25, 880.00, // E5 E5 F#5 E5 A5
    987.77, 987.77, 1046.50, 880.00, 783.99 // B5 B5 C6 A5 G5
  ];

  function createContext(){
    try{
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.12; // удобная громкость по умолчанию
      masterGain.connect(ctx.destination);
      // плавное появление
      masterGain.gain.setValueAtTime(0.0001, ctx.currentTime);
      masterGain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.03);
    }catch(e){
      console.error('WebAudio не поддерживается:', e);
      alert('Ваш браузер не поддерживает Web Audio API — музыка недоступна.');
    }
  }

  function playNote(freq, start, duration){
    if(!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    // мягкое огибающие
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(0.9, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    o.connect(g);
    g.connect(masterGain);
    o.start(start);
    o.stop(start + duration + 0.02);
    scheduledOsc.push({osc:o,gain:g});
    // Очистка по окончании
    const id = setTimeout(()=>{
      try{ o.disconnect(); g.disconnect(); }catch(_){}
      scheduledOsc = scheduledOsc.filter(x=>x.osc!==o);
    }, Math.max(0, (start - ctx.currentTime + duration + 0.05) * 1000));
    return id;
  }

  function startLoop(){
    if(!ctx) createContext();
    if(!ctx) return;
    running = true;
    btn.textContent = '🔈 Выключить музыку';
    btn.setAttribute('aria-pressed','true');
    // Если контекст в suspended, resume
    if(ctx.state === 'suspended') ctx.resume().catch(e=>console.warn(e));

    const beat = 0.28; // длительность шага в секундах
    function scheduleNow(){
      const base = ctx.currentTime + 0.02; // чуть вперед
      for(let i=0;i<NOTES.length;i++){
        const t = base + i * beat;
        // делаем чередование громкости/длительности для интереса
        const dur = (i%4===3) ? beat*0.9 : beat*0.85;
        playNote(NOTES[i], t, dur);
      }
      // Запланировать повтор через длину мелодии
      loopTimer = setTimeout(scheduleNow, Math.ceil(NOTES.length * beat * 1000) );
    }
    scheduleNow();
  }

  function stopLoop(){
    running = false;
    btn.textContent = '🎄 Включить музыку';
    btn.setAttribute('aria-pressed','false');
    // Остановим таймер и все осцилляторы
    if(loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
    // остановка запланированных осцилляторов: просто закрываем контекст для полного сброса
    if(ctx){
      try{
        // Плавное затухание
        masterGain.gain.cancelScheduledValues(ctx.currentTime);
        masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
        // Закрываем через маленькую задержку чтобы дать время затухнуть
        setTimeout(()=>{
          try{ ctx.close(); }catch(_){ }
          ctx = null; masterGain = null; scheduledOsc = [];
        }, 120);
      }catch(e){ console.warn(e); ctx = null; masterGain = null; scheduledOsc = []; }
    }
  }

  btn.addEventListener('click', async function(){
    // Создаём/восстанавливаем AudioContext только по действию пользователя
    try{
      if(!running) {
        startLoop();
      } else {
        stopLoop();
      }
    }catch(e){
      console.error('Ошибка при переключении музыки:', e);
      alert('Ошибка при воспроизведении музыки — откройте консоль для деталей.');
    }
  });

  // На случай, если этот файл будет встраиваться в страницу с перекрывающими стилями,
  // переносим кнопку в body (если её где-то спрятали) и делаем видимой.
  (function ensureVisible(){
    // если кнопка не в document.body — переместим
    if(btn && btn.parentNode !== document.body) document.body.appendChild(btn);
    // маленькая проверка видимости: если computedStyle display:none или visibility:hidden, сделаем inline-block
    try{
      const cs = window.getComputedStyle(btn);
      if(cs.display === 'none' || cs.visibility === 'hidden') btn.style.display = 'inline-block';
    }catch(_){}
  })();
})();
</script>
</body>
</html>
