<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый год 2027 — города России</title>
<style>
:root{--bg1:#04122e;--bg2:#0b2a5b;--ice:#8fd3ff;--white:#f4faff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#020a1c;color:var(--white);font-family:"Segoe UI",Arial,sans-serif}
body{overflow:hidden}
#stage{position:relative;width:100vw;height:100dvh;min-height:420px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--bg2),var(--bg1) 72%)}
#photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.62;transform:scale(1.03);transition:opacity 1.2s ease;background-image:linear-gradient(135deg,#0b2a5b,#04122e)}
#shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,8,24,.68),rgba(2,10,28,.45),rgba(1,8,24,.68)),linear-gradient(0deg,rgba(2,8,22,.45),rgba(2,8,22,.12))}
#musicBtn{position:absolute;z-index:5;right:16px;top:16px;border:1px solid #b8e5ff88;border-radius:999px;padding:10px 15px;background:#04152dcc;color:#fff;font:inherit;cursor:pointer;backdrop-filter:blur(8px)}
#musicStatus{position:absolute;z-index:5;right:18px;top:64px;color:#e2f4ff;font-size:12px;text-shadow:0 1px 4px #000}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
main{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(16px,4vw,64px);padding-bottom:clamp(50px,8vh,90px)}
h1{font-size:clamp(20px,3.4vw,56px);font-weight:300;letter-spacing:.18em;color:var(--ice);margin-bottom:clamp(16px,3vh,34px)}
.timer{display:flex;justify-content:center;gap:clamp(8px,3vw,48px);width:100%;margin-bottom:clamp(16px,3vh,34px)}
.unit{display:flex;flex-direction:column;align-items:center;min-width:0;flex:1}
.unit b{font-size:clamp(36px,11vw, min(17vh,190px));font-size:clamp(36px,11vw,190px);line-height:1;font-weight:200;font-variant-numeric:tabular-nums;text-shadow:0 0 24px #8fd3ff99,0 0 70px #50a0ff73}
.unit span{font-size:clamp(10px,1.8vw,26px);color:var(--ice);margin-top:8px;letter-spacing:.06em}
.lead{font-size:clamp(15px,2.2vw,34px);color:var(--ice);font-weight:300}
#city{font-size:clamp(28px,6.3vw,100px);font-weight:600;line-height:1.15;margin:12px 0;text-shadow:0 0 30px #8fd3ff80;max-width:100%;overflow-wrap:anywhere}
.sub{font-size:clamp(12px,1.7vw,25px);color:#c6e4ff;font-weight:300;max-width:1500px;line-height:1.35;margin-top:5px}
#foot{position:absolute;bottom:clamp(12px,3vh,38px);left:12px;right:12px;text-align:center;font-size:clamp(11px,1.3vw,20px);color:#7fa8d6}
@media(max-width:520px){.timer{gap:7px}.unit b{font-size:clamp(34px,10.5vw,58px)}.unit span{font-size:10px}h1{letter-spacing:.1em}#city{font-size:clamp(26px,7vw,42px)}}
</style>
</head>
<body>
<div id="stage"><div id="photo"></div><div id="shade"></div><button id="musicBtn" type="button">▶ Включить музыку</button><div id="musicStatus">10 новогодних мелодий · без внешних файлов</div><canvas id="snow"></canvas><main>
<h1>НОВЫЙ ГОД 2027</h1>
<div class="timer">
<div class="unit"><b id="d">00</b><span>дней</span></div>
<div class="unit"><b id="h">00</b><span>часов</span></div>
<div class="unit"><b id="m">00</b><span>минут</span></div>
<div class="unit"><b id="s">00</b><span>секунд</span></div>
</div>
<p class="lead">Сейчас отсчёт для города</p>
<div id="city">Петропавловск-Камчатский</div>
<p id="more" class="sub"></p><p id="local" class="sub"></p>
</main><div id="foot">Автоматическая смена города каждые 30 секунд · Россия встречает 2027 год</div></div>
<script>
'use strict';
const ZONES=[
{tz:'Asia/Kamchatka',cities:['Петропавловск-Камчатский','Елизово','Вилючинск']},
{tz:'Asia/Anadyr',cities:['Анадырь','Певек','Билибино']},
{tz:'Asia/Magadan',cities:['Магадан','Сусуман']},
{tz:'Asia/Sakhalin',cities:['Южно-Сахалинск','Корсаков','Холмск','Оха']},
{tz:'Asia/Srednekolymsk',cities:['Среднеколымск','Черский']},
{tz:'Asia/Vladivostok',cities:['Владивосток','Хабаровск','Уссурийск','Находка','Артём','Комсомольск-на-Амуре','Биробиджан','Арсеньев','Большой Камень','Спасск-Дальний']},
{tz:'Asia/Ust-Nera',cities:['Верхоянск','Усть-Нера']},
{tz:'Asia/Yakutsk',cities:['Якутск','Благовещенск','Нерюнгри','Мирный','Ленск','Алдан','Удачный','Свободный','Тында']},
{tz:'Asia/Chita',cities:['Чита','Краснокаменск']},
{tz:'Asia/Irkutsk',cities:['Иркутск','Улан-Удэ','Ангарск','Братск','Усть-Илимск','Северобайкальск','Шелехов']},
{tz:'Asia/Krasnoyarsk',cities:['Красноярск','Норильск','Абакан','Ачинск','Канск','Минусинск','Дудинка','Лесосибирск','Железногорск','Кызыл']},
{tz:'Asia/Novosibirsk',cities:['Новосибирск','Бердск']},
{tz:'Asia/Novokuznetsk',cities:['Кемерово','Новокузнецк','Прокопьевск']},
{tz:'Asia/Barnaul',cities:['Барнаул','Бийск','Горно-Алтайск','Рубцовск']},
{tz:'Asia/Tomsk',cities:['Томск','Северск']},
{tz:'Asia/Omsk',cities:['Омск']},
{tz:'Asia/Yekaterinburg',cities:['Екатеринбург','Челябинск','Уфа','Пермь','Тюмень','Оренбург','Курган','Магнитогорск','Нижний Тагил','Первоуральск','Каменск-Уральский','Златоуст','Миасс','Стерлитамак','Нефтекамск','Березники','Сургут','Нижневартовск','Нефтеюганск','Ханты-Мансийск','Ноябрьск','Новый Уренгой','Салехард']},
{tz:'Europe/Samara',cities:['Самара','Тольятти','Ижевск','Сызрань','Новокуйбышевск','Глазов']},
{tz:'Europe/Saratov',cities:['Саратов','Энгельс','Балаково']},
{tz:'Europe/Ulyanovsk',cities:['Ульяновск','Димитровград']},
{tz:'Europe/Astrakhan',cities:['Астрахань']},
{tz:'Europe/Moscow',cities:['Москва','Санкт-Петербург','Нижний Новгород','Казань','Ростов-на-Дону','Краснодар','Сочи','Новороссийск','Воронеж','Ярославль','Владимир','Кострома','Иваново','Рязань','Тула','Калуга','Смоленск','Брянск','Орёл','Курск','Белгород','Липецк','Тамбов','Тверь','Великий Новгород','Псков','Вологда','Череповец','Архангельск','Мурманск','Петрозаводск','Сыктывкар','Нарьян-Мар','Пенза','Саранск','Чебоксары','Йошкар-Ола','Нижнекамск','Набережные Челны','Ставрополь','Пятигорск','Махачкала','Грозный','Владикавказ','Нальчик','Черкесск','Элиста','Майкоп']},
{tz:'Europe/Volgograd',cities:['Волгоград','Волжский']},
{tz:'Europe/Kirov',cities:['Киров']},
{tz:'Europe/Kaliningrad',cities:['Калининград','Советск','Черняховск','Балтийск']}
];
const YEAR=2027, ROTATE_MS=30000, cities=[];
for(const z of ZONES) for(const name of z.cities) cities.push({name,tz:z.tz});
const fmtCache=new Map();
function formatter(tz){if(!fmtCache.has(tz))fmtCache.set(tz,new Intl.DateTimeFormat('en-GB',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}));return fmtCache.get(tz)}
function offsetAt(tz,ms){const p={};for(const x of formatter(tz).formatToParts(new Date(ms)))p[x.type]=+x.value;return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000}
function newYear(tz){const guess=Date.UTC(YEAR,0,1);let t=guess-offsetAt(tz,guess);return guess-offsetAt(tz,t)}
function clock(tz,ms){return new Intl.DateTimeFormat('ru-RU',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date(ms))}
function utc(tz,ms){const h=offsetAt(tz,ms)/3600000;return 'UTC'+(h>=0?'+':'−')+Math.abs(h)}
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
let current=-1;
// Фото зимних достопримечательностей и городских пейзажей. Изображения загружаются из интернета.
const winterPhotos = [
  'https://images.unsplash.com/photo-1513326738677-b949b9c9e4f8?auto=format&fit=crop&w=1920&q=85', // snowy city
  'https://images.unsplash.com/photo-1512389142860-9c449e58a543?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1455156218388-5e61b526818b?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1486911278844-a81c5267e227?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1920&q=85',
  'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=85'
];
const photoForCity = {
 'Москва':0,'Санкт-Петербург':1,'Казань':2,'Сочи':3,'Владивосток':4,'Новосибирск':5,
 'Екатеринбург':6,'Иркутск':7,'Калининград':8,'Петропавловск-Камчатский':9
};
function changePhoto(city,index){const photoIndex=photoForCity[city] ?? (index % winterPhotos.length);const el=$('photo');el.style.opacity='0.12';const img=new Image();img.onload=()=>{el.style.backgroundImage=`url("${winterPhotos[photoIndex]}")`;requestAnimationFrame(()=>el.style.opacity='.62')};img.onerror=()=>{el.style.backgroundImage='linear-gradient(135deg,#0b2a5b,#04122e)';el.style.opacity='.62'};img.src=winterPhotos[photoIndex];}
// 10 procedurally generated festive instrumental tunes: no copyrighted recordings or extra files.
const tunes = [
 [659,784,880,784,659,587,659,0,523,659,784,659], [523,659,784,1047,988,784,659,523,587,698,880,698],
 [392,523,659,784,659,523,440,587,698,880,698,587], [784,740,784,659,587,659,784,523,587,659,587,523],
 [523,587,659,784,880,784,659,587,523,659,784,523], [659,659,659,659,659,784,523,587,659,0,698,698],
 [392,392,523,392,659,587,523,440,440,440,587,440], [523,659,698,784,698,659,523,587,659,784,659,523],
 [784,659,523,659,784,880,784,659,587,659,523,392], [523,784,659,880,784,659,587,784,698,880,784,523]
];
let audioCtx=null,musicOn=false,seqTimer=null,tuneIndex=0,noteIndex=0,master=null;
function playTuneNote(){if(!musicOn||!audioCtx||!master)return;const tune=tunes[tuneIndex];const freq=tune[noteIndex%tune.length];noteIndex++;if(freq){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.075,audioCtx.currentTime+.035);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.38);osc.connect(gain);gain.connect(master);osc.start();osc.stop(audioCtx.currentTime+.4);if(noteIndex%4===1){const bell=audioCtx.createOscillator(),bg=audioCtx.createGain();bell.type='triangle';bell.frequency.value=freq*2;bg.gain.setValueAtTime(.0001,audioCtx.currentTime);bg.gain.exponentialRampToValueAtTime(.018,audioCtx.currentTime+.02);bg.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.55);bell.connect(bg);bg.connect(master);bell.start();bell.stop(audioCtx.currentTime+.58)}}if(noteIndex>=tune.length){noteIndex=0;tuneIndex=(tuneIndex+1)%tunes.length;$('musicStatus').textContent='Мелодия '+(tuneIndex+1)+' из 10 · инструментальная'} }
$('musicBtn').addEventListener('click',async()=>{if(!musicOn){audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();master=audioCtx.createGain();master.gain.value=.65;master.connect(audioCtx.destination);musicOn=true;$('musicBtn').textContent='Ⅱ Выключить музыку';$('musicStatus').textContent='Играет мелодия 1 из 10';playTuneNote();seqTimer=setInterval(playTuneNote,360)}else{musicOn=false;clearInterval(seqTimer);if(audioCtx)await audioCtx.suspend();$('musicBtn').textContent='▶ Включить музыку';$('musicStatus').textContent='Музыка выключена'}});
function tick(){const now=Date.now();const index=Math.floor(now/ROTATE_MS)%cities.length;const c=cities[index];const target=newYear(c.tz);const left=Math.max(0,Math.ceil((target-now)/1000));$('d').textContent=pad(Math.floor(left/86400));$('h').textContent=pad(Math.floor(left/3600)%24);$('m').textContent=pad(Math.floor(left/60)%60);$('s').textContent=pad(left%60);
if(index!==current){current=index;$('city').textContent=c.name;$('more').textContent='Город '+(index+1)+' из '+cities.length+' · следующий город через 30 секунд';changePhoto(c.name,index);}
$('local').textContent='Местное время: '+clock(c.tz,now)+' ('+utc(c.tz,now)+')';}
tick();setInterval(tick,250);
// Snow animation
const canvas=$('snow'),ctx=canvas.getContext('2d');let flakes=[];
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);flakes=Array.from({length:Math.max(35,Math.round(canvas.clientWidth/15))},()=>({x:Math.random()*canvas.clientWidth,y:Math.random()*canvas.clientHeight,r:1+Math.random()*2.5,v:20+Math.random()*45,p:Math.random()*6}));}
function snow(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,.72)';for(const f of flakes){f.y+=f.v/30;f.p+=.02;if(f.y>h+5){f.y=-5;f.x=Math.random()*w}ctx.beginPath();ctx.arc(f.x+Math.sin(f.p)*8,f.y,f.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(snow)}
addEventListener('resize',resize);resize();requestAnimationFrame(snow);
</script>
</body></html>
